<!doctype html><html lang="hr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Exstreamer Hub</title>
<style>
:root{--bg:#f2f4f8;--card:#fff;--ink:#0e1726;--mute:#68738a;--line:#e2e6ee;--blue:#2f5bff;--live:#ff4b3e;--ok:#12a56b;--warn:#e29a00;--r:16px}
@media(prefers-color-scheme:dark){:root{--bg:#0c1220;--card:#151d30;--ink:#e8ecf5;--mute:#8d99b3;--line:#243049;--blue:#6f8bff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);padding:max(12px,env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line)}
h1{font-size:19px;margin:0;letter-spacing:-.02em}.wrap{max-width:1100px;margin:0 auto}
#air{display:grid;gap:8px;margin-top:10px}#air:empty{display:none}
.job{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:12px;padding:9px 12px}
.job b{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.job small{opacity:.7}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--live);animation:p 1.4s infinite}@keyframes p{50%{box-shadow:0 0 0 7px #ff4b3e22}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
main{padding:16px}.bar{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px}.bar h2{margin:0;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}.mute{color:var(--mute);font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mute)}.dot.on{background:var(--ok)}.dot.off{background:var(--live)}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--mute)}.tag.live{background:var(--live);color:#fff}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer}
button.p{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}button.d{color:var(--live)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input,select{font:inherit;width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
label{display:grid;gap:4px;font-size:13px;color:var(--mute)}label.ck{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px}label.ck input{width:auto}
dialog{border:none;border-radius:20px;padding:20px;width:min(440px,92vw);background:var(--card);color:var(--ink)}dialog::backdrop{background:#0008}
form{display:grid;gap:12px}.li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:4px;padding:8px 8px max(8px,env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
nav button{border:none;background:none;color:var(--mute);flex:1;max-width:160px}nav button.a{color:var(--blue);font-weight:700;background:var(--bg)}
.ev{padding:9px 0;border-bottom:1px solid var(--line)}.ev.error{color:var(--live)}.ev.warn{color:var(--warn)}
</style></head><body>
<header><div class="wrap"><div class="row"><h1>Exstreamer Hub</h1><span class="sp"></span><button class="p" onclick="play()">Pusti zvuk</button></div><div id="air"></div></div></header>
<main class="wrap" id="v"></main>
<nav id="nav"></nav><dialog id="dlg"></dialog>
<script>
let S={devices:[],groups:[],playlists:[],files:[],jobs:[],events:[]},tab='uredaji',mic=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(m,u,b)=>{const r=await fetch('/api/'+u,{method:m,headers:b&&!(b instanceof FormData)?{'content-type':'application/json'}:{},body:b instanceof FormData?b:b&&JSON.stringify(b)});
  const j=await r.json().catch(()=>({}));if(!r.ok){alert(j.error||'Greška');throw 0}return j};
const T={uredaji:'Uređaji',grupe:'Grupe',zvukovi:'Zvukovi',dogadaji:'Događaji'};
function connect(){const w=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/state');
  w.onmessage=e=>{S=JSON.parse(e.data);draw()};w.onclose=()=>setTimeout(connect,2000)}connect();
function fmt(s){if(s==null)return'–';const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(d?d+'d ':'')+h+'h '+m+'m'}
const mb=n=>n==null?'–':(n/1048576).toFixed(1)+' MB';
function draw(){
  $('#nav').innerHTML=Object.entries(T).map(([k,v])=>`<button class="${k==tab?'a':''}" onclick="tab='${k}';draw()">${v}${k=='dogadaji'&&S.events.some(e=>e.level=='error')?' •':''}</button>`).join('');
  $('#air').innerHTML=S.jobs.map(j=>`<div class="job"><span class="pulse"></span><b>${esc(j.label)}</b><small>${esc(j.now||'')}</small><button class="d" onclick="stopJob('${j.id}')">Stop</button></div>`).join('');
  $('#v').innerHTML=({uredaji:vDev,grupe:vGrp,zvukovi:vSnd,dogadaji:vEv})[tab]()}
const bar=(t,btn)=>`<div class="bar"><h2>${t}</h2>${btn||''}</div>`;
function vDev(){return bar('Uređaji',`<button class="p" onclick="devForm()">Dodaj uređaj</button>`)+`<div class="grid">`+(S.devices.map(d=>{const s=d.stat,j=S.jobs.find(j=>j.id==d.jobId);
  return`<div class="card"><div class="row"><span class="dot ${s.online===true?'on':s.online===false?'off':''}"></span><b>${esc(d.name)}</b><span class="sp"></span>${j?'<span class="tag live">u eteru</span>':''}</div>
  <div class="mute">${esc(d.ip)}:${d.port} ${s.descr?'· '+esc(s.descr).slice(0,40):''}</div>
  <div class="mute">${d.snmp===false?'SNMP isključen':`Uptime ${fmt(s.uptime)} · ↓ ${mb(s.rx)} · ↑ ${mb(s.tx)}`}</div>
  <div class="row"><button class="p" onclick="play('device:${d.id}')">Pusti</button><button onclick="devForm('${d.id}')">Uredi</button><span class="sp"></span><button class="d" onclick="del('devices','${d.id}')">Obriši</button></div></div>`}).join('')||'<p class="mute">Još nema uređaja. Dodaj prvi Exstreamer 100.</p>')+'</div>'}
function vGrp(){return bar('Grupe',`<button class="p" onclick="grpForm()">Nova grupa</button>`)+`<div class="grid">`+(S.groups.map(g=>{
  const n=g.deviceIds.map(i=>S.devices.find(d=>d.id==i)?.name).filter(Boolean);
  return`<div class="card"><b>${esc(g.name)}</b><div class="mute">${g.multicast?'Multicast '+esc(g.multicast)+':'+g.port:'Unicast na svaki uređaj'}</div><div class="mute">${esc(n.join(', ')||'Nema uređaja')}</div>
  <div class="row"><button class="p" onclick="play('group:${g.id}')">Pusti</button><button onclick="grpForm('${g.id}')">Uredi</button><span class="sp"></span><button class="d" onclick="del('groups','${g.id}')">Obriši</button></div></div>`}).join('')||'<p class="mute">Grupiraj uređaje i dodijeli im multicast adresu.</p>')+'</div>'}
function vSnd(){return bar('Zvučni zapisi',`<label class="btn" style="cursor:pointer">Učitaj MP3<input type="file" accept="audio/*" multiple hidden onchange="up(this)"></label>`)+
  `<div class="card">`+(S.files.map(f=>`<div class="li"><span>${esc(f)}</span><audio controls preload="none" src="/api/files/${encodeURIComponent(f)}" style="height:32px;max-width:40%"></audio><button class="d" onclick="delFile('${esc(f)}')">✕</button></div>`).join('')||'<p class="mute">Učitaj MP3 datoteke na server.</p>')+`</div>`+
  bar('Playliste',`<span class="row"><label class="btn" style="cursor:pointer">Uvezi .m3u<input type="file" accept=".m3u,.m3u8" hidden onchange="imp(this)"></label><button class="p" onclick="plForm()">Nova</button></span>`).replace('class="bar"','class="bar" style="margin-top:24px"')+
  `<div class="card">`+(S.playlists.map(p=>`<div class="li"><span><b>${esc(p.name)}</b> <span class="mute">${p.tracks.length} zapisa</span></span><button onclick="plForm('${p.id}')">Uredi</button><button class="d" onclick="del('playlists','${p.id}')">✕</button></div>`).join('')||'<p class="mute">Nema playlista.</p>')+`</div>`}
function vEv(){return bar('Događaji i upozorenja')+`<div class="card">`+(S.events.map(e=>`<div class="ev ${e.level}"><span class="mute">${new Date(e.t).toLocaleString('hr')}</span><br>${esc(e.msg)}</div>`).join('')||'<p class="mute">Sve mirno.</p>')+`</div>`}
/* dijalozi */
const dlg=$('#dlg');const show=h=>{dlg.innerHTML=h;dlg.showModal()};
const fld=(l,n,v='',t='text')=>`<label>${l}<input name="${n}" type="${t}" value="${esc(v)}"></label>`;
function submit(fn){dlg.querySelector('form').onsubmit=async e=>{e.preventDefault();await fn(Object.fromEntries(new FormData(e.target)),e.target);dlg.close()}}
const btns=`<div class="row"><span class="sp"></span><button type="button" onclick="dlg.close()">Odustani</button><button class="p">Spremi</button></div>`;
function devForm(id){const d=S.devices.find(x=>x.id==id)||{port:4444,community:'public'};
  show(`<form><h2>${id?'Uredi':'Novi'} uređaj</h2>${fld('Naziv','name',d.name)}${fld('IP adresa','ip',d.ip)}${fld('RTP/UDP port','port',d.port,'number')}${fld('SNMP community','community',d.community)}
  <label class="ck"><input type="checkbox" name="snmp" ${d.snmp===false?'':'checked'}>Prati SNMP-om</label>${btns}</form>`);
  submit(b=>{b.snmp=b.snmp==='on';return api(id?'PUT':'POST','devices'+(id?'/'+id:''),b)})}
function grpForm(id){const g=S.groups.find(x=>x.id==id)||{port:4444,deviceIds:[]};
  show(`<form><h2>${id?'Uredi':'Nova'} grupa</h2>${fld('Naziv','name',g.name)}${fld('Multicast adresa (npr. 239.10.10.1)','multicast',g.multicast)}${fld('Port','port',g.port,'number')}
  <div>${S.devices.map(d=>`<label class="ck"><input type="checkbox" name="dev" value="${d.id}" ${g.deviceIds.includes(d.id)?'checked':''}>${esc(d.name)}</label>`).join('')}</div>${btns}</form>`);
  submit((b,f)=>{b.deviceIds=[...f.querySelectorAll('[name=dev]:checked')].map(x=>x.value);return api(id?'PUT':'POST','groups'+(id?'/'+id:''),b)})}
function plForm(id){const p=S.playlists.find(x=>x.id==id)||{tracks:[]};
  show(`<form><h2>${id?'Uredi':'Nova'} playlista</h2>${fld('Naziv','name',p.name)}<div style="max-height:40vh;overflow:auto">${S.files.map(f=>`<label class="ck"><input type="checkbox" name="t" value="${esc(f)}" ${p.tracks.includes(f)?'checked':''}>${esc(f)}</label>`).join('')}</div>${btns}</form>`);
  submit((b,f)=>{b.tracks=[...f.querySelectorAll('[name=t]:checked')].map(x=>x.value);return api(id?'PUT':'POST','playlists'+(id?'/'+id:''),b)})}
function play(t){const o=(a,f)=>a.map(f).join('');
  show(`<form><h2>Pusti zvuk</h2><label>Kamo<select name="target">${o(S.groups,g=>`<option value="group:${g.id}" ${t=='group:'+g.id?'selected':''}>Grupa: ${esc(g.name)}</option>`)}${o(S.devices,d=>`<option value="device:${d.id}" ${t=='device:'+d.id?'selected':''}>${esc(d.name)}</option>`)}</select></label>
  <label>Što<select name="src"><optgroup label="Mikrofon"><option value="live">Govori uživo (mikrofon)</option></optgroup><optgroup label="Zapisi">${o(S.files,f=>`<option value="file:${esc(f)}">${esc(f)}</option>`)}</optgroup><optgroup label="Playliste">${o(S.playlists,p=>`<option value="playlist:${p.id}">${esc(p.name)}</option>`)}</optgroup></select></label>
  <label class="ck"><input type="checkbox" name="loop">Ponavljaj (petlja)</label><p class="mute">Pojedinačna obavijest ima prednost pred grupnom, a grupna pred playlistom.</p>${btns.replace('Spremi','Pusti')}</form>`);
  submit(async b=>{const [tt,ti]=b.target.split(':'),[st,sv]=b.src.split(/:(.*)/s);if(b.src=='live')return live(b.target);
    const r=await api('POST','play',{target:{type:tt,id:ti},source:st=='file'?{type:'file',name:sv}:{type:'playlist',id:sv},loop:b.loop==='on'});
    if(r.skipped.length)alert('Preskočeno (zauzeto): '+r.skipped.join(', '))})}
async function live(target){stopMic();try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host+'/ws/live?target='+target);
  const rec=new MediaRecorder(stream);mic={ws,rec,stream};
  ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.error){alert(m.error);stopMic()}else{rec.start(250)}};
  rec.ondataavailable=e=>ws.readyState==1&&e.data.size&&ws.send(e.data);ws.onclose=stopMic}
  catch(e){alert('Mikrofon nije dostupan. Za pristup mikrofonu treba HTTPS ili localhost.')}}
function stopMic(){if(!mic)return;const m=mic;mic=null;try{m.rec.state!='inactive'&&m.rec.stop()}catch{};m.stream.getTracks().forEach(t=>t.stop());try{m.ws.close()}catch{}}
const stopJob=async id=>{stopMic();await api('POST','stop',{jobId:id})};
const del=(k,id)=>confirm('Obrisati?')&&api('DELETE',k+'/'+id),delFile=f=>confirm('Obrisati '+f+'?')&&api('DELETE','files/'+encodeURIComponent(f));
const up=async i=>{const f=new FormData();[...i.files].forEach(x=>f.append('f',x));await api('POST','files',f)};
const imp=async i=>{const f=new FormData();f.append('f',i.files[0]);await api('POST','playlists/import',f)};
draw();
</script></body></html>
