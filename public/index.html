<!doctype html><html lang="hr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a3d78"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><title>Exstreamer Hub</title>
<style>
:root{--navy:#0a3d78;--blue:#0f62b3;--sky:#e8f1fb;--bg:#f4f6f9;--ink:#1c2b3a;--mute:#6b7a8c;--line:#dbe2ea;--live:#d62f2f;--ok:#1e9d5b;--warn:#d98a00}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Open Sans","Segoe UI",system-ui,sans-serif;padding-bottom:76px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top)}.wrap{max-width:1140px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:14px;min-height:64px}.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:17px}
.logo b{display:grid;place-items:center;width:34px;height:34px;background:#fff;color:var(--navy);border-radius:3px}.logo small{display:block;font-weight:400;letter-spacing:.12em;font-size:10px;opacity:.75}
[hidden]{display:none!important}.mark{width:40px;height:40px;border-radius:9px;flex:none;display:block}#locbar{background:#fff;border-bottom:1px solid var(--line)}#locbar .chips{display:flex;gap:8px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:thin}
.chip{white-space:nowrap;border-radius:99px;padding:6px 14px;text-transform:none;letter-spacing:0;flex:none}.chip.a{background:var(--navy);color:#fff;border-color:var(--navy)}.chip small{opacity:.65;font-weight:400}
.sp{flex:1}#co.has{width:auto;min-width:44px;height:44px;padding:5px 8px}#co.has img{display:block;height:100%;max-width:103px;width:auto;object-fit:contain}
button.al{background:var(--live);border-color:var(--live);color:#fff;padding:8px 11px}button.al:hover{background:#b82424;border-color:#b82424}button.al.off{opacity:.4}button.al.custom{background:#6f42c1;border-color:#6f42c1}button.al.custom:hover{background:#5a32a3;border-color:#5a32a3}
.about a{color:var(--blue)}.about dt{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-top:12px}.about dd{margin:2px 0 0}.who{display:flex;gap:8px;align-items:center;font-size:13px}.who .tag{background:#ffffff22;color:#fff}
nav{display:flex;gap:2px;border-top:1px solid #ffffff22}nav button{display:flex;align-items:center;gap:8px;border:0;background:none;color:#ffffffbb;padding:13px 18px;font:600 13px inherit;letter-spacing:.08em;text-transform:uppercase;border-bottom:3px solid transparent;border-radius:0;cursor:pointer}
nav button.a{color:#fff;border-bottom-color:#fff;background:#ffffff14}nav button:hover{color:#fff}
#air{display:grid;gap:0;background:var(--live)}#air:empty{display:none}
.job{display:flex;align-items:center;gap:12px;color:#fff;padding:9px 0}.job b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.job small{opacity:.8}
.vu{width:160px;height:12px;flex:none;background:#0005;-webkit-mask-image:repeating-linear-gradient(90deg,#000 0 5px,transparent 5px 7px);mask-image:repeating-linear-gradient(90deg,#000 0 5px,transparent 5px 7px);border-radius:2px;overflow:hidden}
.vu i{display:block;height:100%;background:linear-gradient(90deg,#4cd37b 0 62%,#ffd23f 62% 85%,#fff 85%);clip-path:inset(0 100% 0 0);transition:clip-path .08s linear}
.job small{max-width:28%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.job b{min-width:0}
.pulse{width:10px;height:10px;border-radius:50%;background:#fff;animation:p 1.4s infinite}@keyframes p{50%{box-shadow:0 0 0 7px #fff3}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
main{padding:24px 16px}.bar{display:flex;align-items:center;gap:10px;margin:0 0 16px;padding-bottom:10px;border-bottom:2px solid var(--line);position:relative}
.bar:after{content:"";position:absolute;left:0;bottom:-2px;width:64px;height:2px;background:var(--blue)}.bar h2{margin:0;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--navy);flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:3px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 3px #0a3d7810}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.mute{color:var(--mute);font-size:13px}
.ico{display:grid;place-items:center;width:38px;height:38px;background:var(--sky);color:var(--blue);border-radius:3px}
.dot{width:10px;height:10px;border-radius:50%;background:#b5bfcb}.dot.on{background:var(--ok)}.dot.off{background:var(--live)}
.tag{font-size:11px;padding:2px 8px;border-radius:2px;background:var(--sky);color:var(--blue);font-weight:700;text-transform:uppercase;letter-spacing:.05em}.tag.live{background:var(--live);color:#fff}
button,.btn{display:inline-flex;align-items:center;gap:7px;font:600 13px inherit;border:1px solid var(--line);background:#fff;color:var(--navy);padding:8px 14px;border-radius:3px;cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
button:hover,.btn:hover{border-color:var(--blue)}button.p{background:var(--blue);border-color:var(--blue);color:#fff}button.p:hover{background:var(--navy)}button.d{color:var(--live)}button.d:hover{border-color:var(--live)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input,select{font:inherit;width:100%;padding:9px 11px;border-radius:3px;border:1px solid var(--line);background:#fff;color:var(--ink)}
label{display:grid;gap:4px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}label.ck{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px;text-transform:none;letter-spacing:0}label.ck input{width:auto}
dialog{border:none;border-top:4px solid var(--blue);border-radius:3px;padding:22px;width:min(440px,92vw);background:#fff;color:var(--ink)}dialog::backdrop{background:#0a1a3099}dialog h2{margin:0 0 4px;color:var(--navy);font-size:17px}
form{display:grid;gap:12px}.li{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.li>span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li:last-child{border:0}
.ev{padding:9px 0;border-bottom:1px solid var(--line);border-left:3px solid transparent;padding-left:10px}.ev.error{color:var(--live);border-color:var(--live)}.ev.warn{color:var(--warn);border-color:var(--warn)}
@media(max-width:720px){.vu{width:84px}.job small{display:none}nav{position:fixed;bottom:0;left:0;right:0;background:var(--navy);border-top:1px solid #ffffff33;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom);z-index:9}
 nav button{flex-direction:column;gap:2px;font-size:10px;padding:8px 6px;flex:1;justify-content:center;border-bottom:0;border-top:3px solid transparent}nav button.a{border-top-color:#fff}.logo small,.who .tag{display:none}.hide-m{display:none}}
</style></head><body>
<header><div class="wrap"><div class="top"><div class="logo"><b id="co" hidden></b><img class="mark" src="/favicon.svg" alt=""><span>Exstreamer Hub<small>Upravljanje zvučnicima</small></span></div><span class="sp"></span>
<div class="who" id="who"></div></div></div><div class="wrap" style="border-top:1px solid #ffffff22"><nav id="nav"></nav></div><div id="locbar" hidden></div><div id="air"><div class="wrap" id="airi"></div></div></header>
<main class="wrap" id="v"></main><dialog id="dlg"></dialog>
<script>
const P={play:'<polygon points="6 3 20 12 6 21"/>',stop:'<rect x="5" y="5" width="14" height="14" rx="1"/>',plus:'<path d="M12 5v14M5 12h14"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',upload:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',mic:'<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/>',spk:'<path d="M4 9h4l5-4v14l-5-4H4zM16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/>',grp:'<path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/>',mus:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',act:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',pin:'<path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',belloff:'<path d="M8.7 3A6 6 0 0118 8c0 2.7.6 4.7 1.2 6M17 17H3s3-2 3-9c0-.9.2-1.7.5-2.5M10.3 21a1.94 1.94 0 003.4 0M2 2l20 20"/>',bell:'<path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 003.4 0"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',out:'<path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/>',key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'};
const I=n=>`<svg class="i" viewBox="0 0 24 24">${P[n]}</svg>`;
let S={locations:[],devices:[],groups:[],playlists:[],files:[],jobs:[],events:[]},tab='uredaji',mic=null,role=null,user='';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),adm=()=>role==='admin';
let about={};
const brand=()=>{const e=$('#co');if(about.logo){e.hidden=false;e.className='has';e.innerHTML='<img src="/logo" alt="'+esc(about.company)+'">'}else e.hidden=true};
brand();fetch('/api/about').then(r=>r.json()).then(a=>{about=a;brand();draw()}).catch(()=>{});
const api=async(m,u,b)=>{const r=await fetch('/api/'+u,{method:m,headers:b&&!(b instanceof FormData)?{'content-type':'application/json'}:{},body:b instanceof FormData?b:b&&JSON.stringify(b)});
  const j=await r.json().catch(()=>({}));if(r.status==401&&u!=='login'){loginForm();throw 0}if(!r.ok){alert(j.error||'Greška');throw 0}if(m!=='GET'&&u!=='login'&&u!=='logout')refresh();return j};
async function refresh(){try{S=await api('GET','state');draw()}catch{}}
setInterval(()=>{if(role&&(!ws||ws.readyState!==1))refresh()},4000);
const lv={};
function vu(l){for(const id in l){lv[id]=Math.max(l[id],(lv[id]||0)*.82);const i=document.querySelector('#vu-'+id+' i');if(i)i.style.clipPath=`inset(0 ${(1-lv[id])*100}% 0 0)`}}
const T={uredaji:['Uređaji','spk'],grupe:['Grupe','grp'],lokacije:['Lokacije','pin'],zvukovi:['Zvukovi','mus'],dogadaji:['Događaji','act'],onama:['O aplikaciji','info']};
let ws;function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/state');
  ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='vu')return vu(m.l);S=m;draw()};ws.onclose=()=>role&&setTimeout(connect,2000)}
async function init(){try{const m=await api('GET','me');role=m.role;user=m.user;connect();draw();refresh()}catch{}}
function fmt(s){if(s==null)return'–';const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(d?d+'d ':'')+h+'h '+m+'m'}
const mb=n=>n==null?'–':(n/1048576).toFixed(1)+' MB';
const TT={trash:'Obriši',edit:'Uredi'};
const B=(ic,t,cls='',oc='')=>`<button class="${cls}" onclick="${oc}"${t?'':` title="${TT[ic]||''}" aria-label="${TT[ic]||''}"`}>${I(ic)}${t?`<span>${t}</span>`:''}</button>`;
function draw(){if(loc!=='all'&&loc!=='none'&&!S.locations.some(l=>l.id===loc))loc='all';drawLoc();
  $('#who').innerHTML=`<span class="tag">${esc(user)} · ${adm()?'Administrator':'Operator'}</span>`+B('out','<span class="hide-m">Odjava</span>','','logout()')+B('play','Pusti zvuk','p','play()');
  $('#nav').innerHTML=Object.entries(T).map(([k,[v,ic]])=>`<button class="${k==tab?'a':''}" onclick="tab='${k}';draw()">${I(ic)}<span>${v}${k=='dogadaji'&&S.events.some(e=>e.level=='error')?' •':''}</span></button>`).join('');
  $('#airi').innerHTML=S.jobs.map(j=>`<div class="job"><span class="pulse"></span><b>${esc(j.label)}</b><div class="vu" id="vu-${j.id}"><i style="clip-path:inset(0 ${(1-(lv[j.id]||0))*100}% 0 0)"></i></div><small>${esc(j.now||'')}</small>${B('stop','Stop','',`stopJob('${j.id}')`)}</div>`).join('');
  $('#v').innerHTML=({uredaji:vDev,grupe:vGrp,lokacije:vLoc,zvukovi:vSnd,dogadaji:vEv,onama:vAbout})[tab]()}
const bar=(t,btn)=>`<div class="bar"><h2>${t}</h2>${btn||''}</div>`;
const empty=t=>`<p class="mute">${t}</p>`;
function vDev(){return bar('Uređaji',adm()?B('plus','Dodaj uređaj','p','devForm()'):'')+`<div class="grid">`+(devList().map(d=>{const s=d.stat,j=S.jobs.find(j=>j.id==d.jobId);
  return`<div class="card"><div class="row"><span class="ico">${I('spk')}</span><div style="flex:1"><b>${esc(d.name)}</b><div class="mute">${esc(d.ip)}:${d.port}${lname(d)?' · '+esc(lname(d)):''}</div></div>${j?'<span class="tag live">u eteru</span>':`<span class="dot ${s.online===true?'on':s.online===false?'off':''}" title="${d.snmp===false?'SNMP praćenje isključeno':s.online===true?'Online':s.online===false?'Offline':'Nepoznato'}"></span>`}</div>
  <div class="mute">${d.snmp===false?'SNMP isključen':`Uptime ${fmt(s.uptime)}${s.fw?' · FW '+esc(s.fw):''}${s.pps>=5?' · prima tok '+Math.round(s.pps)+' pkt/s':''}${s.audio!=null&&(j||s.audio>0)?' · audio '+(['tišina','radi','glasno'][s.audio]||s.audio):''}`}</div>
  <div class="row">${B('play','Pusti','p',`play('device:${d.id}')`)}<button class="al ${d.alarmMode==='custom'?'custom':d.alarmMode==='none'?'off':''}" title="${esc(d.alarmMode==='none'?'Alarm isključen':'Alarm ('+(d.alarmMode==='custom'?'vlastiti':'zadani')+'): '+d.alarmLabel)}" aria-label="Alarm" onclick="alarm('${d.id}')">${I(d.alarmMode==='none'?'belloff':'bell')}</button>${adm()?B('edit','Uredi','',`devForm('${d.id}')`)+`<span style="flex:1"></span>`+B('trash','','d',`del('devices','${d.id}')`):''}</div></div>`}).join('')||empty(S.devices.length?'Nema uređaja na ovoj lokaciji.':'Još nema uređaja.'))+'</div>'}
function vGrp(){return bar('Grupe',adm()?B('plus','Nova grupa','p','grpForm()'):'')+`<div class="grid">`+(S.groups.map(g=>{
  const n=g.deviceIds.map(i=>S.devices.find(d=>d.id==i)?.name).filter(Boolean);
  return`<div class="card"><div class="row"><span class="ico">${I('grp')}</span><div style="flex:1"><b>${esc(g.name)}</b><div class="mute">${g.multicast?'Multicast '+esc(g.multicast)+':'+g.port:'Unicast na svaki uređaj'}</div></div></div><div class="mute">${esc(n.join(', ')||'Nema uređaja')}</div>
  <div class="row">${B('play','Pusti','p',`play('group:${g.id}')`)}${adm()?B('edit','Uredi','',`grpForm('${g.id}')`)+`<span style="flex:1"></span>`+B('trash','','d',`del('groups','${g.id}')`):''}</div></div>`}).join('')||empty('Nema grupa.'))+'</div>'}
function vSnd(){return bar('Zvučni zapisi',adm()?`<label class="btn" style="cursor:pointer">${I('upload')}Učitaj MP3<input type="file" accept="audio/*" multiple hidden onchange="up(this)"></label>`:'')+
  `<div class="card">`+(S.files.map(f=>`<div class="li"><span class="ico">${I('mus')}</span><span>${esc(f)}</span><audio controls preload="none" src="/api/files/${encodeURIComponent(f)}" style="height:32px;max-width:36%"></audio>${adm()?B('trash','','d',`delFile('${esc(f)}')`):''}</div>`).join('')||empty('Nema zapisa.'))+`</div><div style="height:28px"></div>`+
  bar('Playliste',adm()?`<label class="btn" style="cursor:pointer">${I('upload')}Uvezi .m3u<input type="file" accept=".m3u,.m3u8" hidden onchange="imp(this)"></label>`+B('plus','Nova','p','plForm()'):'')+
  `<div class="card">`+(S.playlists.map(p=>`<div class="li"><span class="ico">${I('list')}</span><span><b>${esc(p.name)}</b> <span class="mute">${p.tracks.length} zapisa</span></span>${adm()?B('edit','','',`plForm('${p.id}')`)+B('trash','','d',`del('playlists','${p.id}')`):''}</div>`).join('')||empty('Nema playlista.'))+`</div>`}
function vEv(){return bar('Događaji i upozorenja')+`<div class="card">`+(S.events.map(e=>`<div class="ev ${e.level}"><span class="mute">${new Date(e.t).toLocaleString('hr')}${e.user?' · <b>'+esc(e.user)+'</b>':''}</span><br>${esc(e.msg)}</div>`).join('')||empty('Sve mirno.'))+`</div>`}
let loc='all';try{loc=localStorage.getItem('loc')||'all'}catch{}
const lname=d=>(S.locations.find(l=>l.id===d.locationId)||{}).name||'';
const devList=()=>S.devices.filter(d=>loc==='all'||(loc==='none'?!d.locationId:d.locationId===loc));
function setLoc(id){loc=id;try{localStorage.setItem('loc',id)}catch{}draw()}
function drawLoc(){const e=$('#locbar');if(tab!=='uredaji'){e.hidden=true;return}e.hidden=false;
  const cnt=id=>S.devices.filter(d=>(d.locationId||'')===id).length,un=cnt('');
  const chips=[['all','Sve',S.devices.length],...S.locations.map(l=>[l.id,l.name,cnt(l.id)]),...(S.locations.length&&un?[['none','Bez lokacije',un]]:[])];
  e.innerHTML=`<div class="wrap chips">`+chips.map(([id,n,c])=>`<button class="chip ${loc===id?'a':''}" onclick="setLoc('${id}')">${esc(n)} <small>${c}</small></button>`).join('')+`</div>`}
function vLoc(){return bar('Lokacije',adm()?B('plus','Nova lokacija','p','locForm()'):'')+`<div class="grid">`+(S.locations.map(l=>{const n=S.devices.filter(d=>d.locationId===l.id).length;
  return`<div class="card"><div class="row"><span class="ico">${I('pin')}</span><div style="flex:1"><b>${esc(l.name)}</b><div class="mute">${n} ${n===1?'uređaj':'uređaja'}</div></div></div>
  <div class="row">${B('spk','Uređaji','p',`setLoc('${l.id}');tab='uredaji';draw()`)}${adm()?B('edit','Uredi','',`locForm('${l.id}')`)+`<span style="flex:1"></span>`+B('trash','','d',`del('locations','${l.id}')`):''}</div></div>`}).join('')||empty(adm()?'Još nema lokacija. Dodaj prvu (npr. zgrada, hala, kat).':'Nema definiranih lokacija.'))+'</div>'}
function locForm(id){const l=S.locations.find(x=>x.id==id)||{};show(`<form><h2>${id?'Uredi':'Nova'} lokacija</h2>${fld('Naziv lokacije','name',l.name)}${btns()}</form>`);submit(b=>api(id?'PUT':'POST','locations'+(id?'/'+id:''),b))}
const ON={'1.3.6.1.4.1.17491.2.1.1.1.0':'audioStateLeft','1.3.6.1.4.1.17491.2.1.1.2.0':'audioStateRight','1.3.6.1.4.1.17491.2.1.2.1.0':'streamingBufferLevel','1.3.6.1.4.1.17491.2.1.2.2.0':'streamingFrameLoss','1.3.6.1.4.1.17491.2.1.2.3.0':'streamingSoftErrorCount','1.3.6.1.4.1.17491.2.1.3.1.0':'exstreamingStreamNumber','1.3.6.1.4.1.17491.2.1.3.3.0':'exstreamingBitrate','1.3.6.1.4.1.17491.2.1.3.4.0':'exstreamingReconnects','1.3.6.1.2.1.7.1.0':'udpInDatagrams','1.3.6.1.2.1.7.3.0':'udpInErrors','1.3.6.1.2.1.7.4.0':'udpOutDatagrams','1.3.6.1.2.1.2.2.1.10.1':'ifInOctets','1.3.6.1.2.1.2.2.1.16.1':'ifOutOctets','1.3.6.1.2.1.2.2.1.11.1':'ifInUcastPkts','1.3.6.1.2.1.2.2.1.17.1':'ifOutUcastPkts','1.3.6.1.2.1.2.2.1.18.1':'ifOutNUcastPkts'};
const diagBlock=id=>`<button type="button" id="diagbtn" onclick="snmpDiff('${id}')">${I('act')}SNMP dijagnostika</button><div id="diag" class="mute" style="max-height:30vh;overflow:auto;font:12px/1.5 monospace;text-transform:none;letter-spacing:0"></div>`;
async function snmpDiff(id){const o=$('#diag'),b=$('#diagbtn');b.disabled=true;o.textContent='Snimam stanje… Pokreni zvuk na ovom uređaju u idućih 15 s.';
  try{const r=await api('POST','devices/'+id+'/snmp-diff',{seconds:15});
    o.innerHTML=r.changes.length?`<b>Promijenjeno u ${r.seconds} s (pregledano ${r.total} OID-ova):</b><br>`+r.changes.map(c=>`${esc(ON[c.oid]||c.oid)}: ${c.before} → ${c.after} (<b>+${c.delta}</b>, ${Math.round(c.delta/r.seconds*10)/10}/s)`).join('<br>'):'Nijedan brojač se nije promijenio.'}
  catch{o.textContent=''}finally{b.disabled=false}}
async function alarm(id){const d=S.devices.find(x=>x.id==id);
  if(d.alarmMode==='none')return alert('Alarm je isključen ili nije postavljen za ovaj uređaj. Administrator ga postavlja u izborniku Uredi.');
  if(!confirm(`Pustiti ALARM (${d.alarmLabel}) na „${d.name}“?`))return;await api('POST','alarm',{id})}
function vAbout(){const a=about,row=(l,v)=>v?`<dt>${l}</dt><dd>${v}</dd>`:'';
  return bar('O aplikaciji')+`<div class="card about"><div class="row"><img class="mark" src="/favicon.svg" alt=""><div><b>Exstreamer Hub</b><div class="mute">Upravljanje Barix Exstreamer 100 zvučnicima</div></div></div>
  ${a.description?`<p style="white-space:pre-line;margin:6px 0 0">${esc(a.description)}</p>`:'<p class="mute">Opis aplikacije postavlja se u docker-compose.yml (ABOUT_DESCRIPTION).</p>'}
  <dl style="margin:0">${row('Tvrtka',esc(a.company))}${row('Kontakt osoba',esc(a.name))}${row('E-mail',a.email?`<a href="mailto:${esc(a.email)}">${esc(a.email)}</a>`:'')}${row('Telefon',a.phone?`<a href="tel:${esc(a.phone.replace(/[^+\d]/g,''))}">${esc(a.phone)}</a>`:'')}${row('Prijavljeni korisnik',esc(user)+' · '+(adm()?'administrator':'operator'))}</dl></div>`}
const dlg=$('#dlg');const show=h=>{dlg.oncancel=null;dlg.innerHTML=h;if(!dlg.open)dlg.showModal()};
const fld=(l,n,v='',t='text')=>`<label>${l}<input name="${n}" type="${t}" value="${esc(v)}"></label>`;
function submit(fn){dlg.querySelector('form').onsubmit=async e=>{e.preventDefault();try{await fn(Object.fromEntries(new FormData(e.target)),e.target);dlg.close()}catch{}}}
const btns=(l='Spremi')=>`<div class="row" style="justify-content:flex-end"><button type="button" onclick="dlg.close()">Odustani</button><button class="p">${l}</button></div>`;
const drop=()=>{if(ws){ws.onclose=null;ws.close()}};
function loginForm(){show(`<form><h2>Prijava</h2><p class="mute" style="margin:0;text-transform:none;letter-spacing:0">Operatori: korisničko ime i lozinka iz Active Directoryja. Administrator: korisničko ime <b>admin</b>.</p>${fld('Korisničko ime','username')}${fld('Lozinka','password','','password')}<div class="row" style="justify-content:flex-end"><button class="p">${I('key')}Prijava</button></div></form>`);
  dlg.oncancel=e=>e.preventDefault();dlg.querySelector('[name=username]').autocomplete='username';dlg.querySelector('[name=password]').autocomplete='current-password';
  submit(async b=>{const m=await api('POST','login',b);role=m.role;user=m.user;drop();connect();draw()})}
async function logout(){await api('POST','logout',{});role=null;user='';drop();S.jobs=[];loginForm()}
function devForm(id){const d=S.devices.find(x=>x.id==id)||{port:4444,community:'public'};
  show(`<form><h2>${id?'Uredi':'Novi'} uređaj</h2>${fld('Naziv','name',d.name)}${fld('IP adresa','ip',d.ip)}${fld('RTP/UDP port','port',d.port,'number')}${fld('SNMP community','community',d.community)}
  <label>Lokacija<select name="locationId"><option value="">— bez lokacije —</option>${S.locations.map(l=>`<option value="${l.id}" ${(d.locationId??(id?'':(loc!=='all'&&loc!=='none'?loc:'')))===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select></label>
  <label>Alarm<select name="alarm"><option value="">Zadano${(d.alarmDefault||S.alarmDefault)?' ('+esc(d.alarmDefault||S.alarmDefault)+')':' (nije definirano u compose-u)'}</option><option value="none" ${d.alarm==='none'?'selected':''}>Isključen (bez alarma)</option><optgroup label="Zapisi">${S.files.map(f=>`<option value="file:${esc(f)}" ${d.alarm==='file:'+f?'selected':''}>${esc(f)}</option>`).join('')}</optgroup><optgroup label="Playliste">${S.playlists.map(p=>`<option value="playlist:${p.id}" ${d.alarm==='playlist:'+p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</optgroup></select></label>
  <label class="ck"><input type="checkbox" name="snmp" ${d.snmp===false?'':'checked'}>Prati SNMP-om (dostupnost, tok, greške)</label>${id?diagBlock(id):''}${btns()}</form>`);
  submit(b=>{b.snmp=b.snmp==='on';return api(id?'PUT':'POST','devices'+(id?'/'+id:''),b)})}
function grpForm(id){const g=S.groups.find(x=>x.id==id)||{port:4444,deviceIds:[]};
  show(`<form><h2>${id?'Uredi':'Nova'} grupa</h2>${fld('Naziv','name',g.name)}${fld('Multicast adresa (npr. 239.10.10.1)','multicast',g.multicast)}${fld('Port','port',g.port,'number')}
  <div>${S.devices.map(d=>`<label class="ck"><input type="checkbox" name="dev" value="${d.id}" ${g.deviceIds.includes(d.id)?'checked':''}>${esc(d.name)}${lname(d)?` <span class="mute">· ${esc(lname(d))}</span>`:''}</label>`).join('')}</div>${btns()}</form>`);
  submit((b,f)=>{b.deviceIds=[...f.querySelectorAll('[name=dev]:checked')].map(x=>x.value);return api(id?'PUT':'POST','groups'+(id?'/'+id:''),b)})}
function plForm(id){const p=S.playlists.find(x=>x.id==id)||{tracks:[]};
  show(`<form><h2>${id?'Uredi':'Nova'} playlista</h2>${fld('Naziv','name',p.name)}<div style="max-height:40vh;overflow:auto">${S.files.map(f=>`<label class="ck"><input type="checkbox" name="t" value="${esc(f)}" ${p.tracks.includes(f)?'checked':''}>${esc(f)}</label>`).join('')}</div>${btns()}</form>`);
  submit((b,f)=>{b.tracks=[...f.querySelectorAll('[name=t]:checked')].map(x=>x.value);return api(id?'PUT':'POST','playlists'+(id?'/'+id:''),b)})}
function play(t){const o=(a,f)=>a.map(f).join('');
  show(`<form><h2>Pusti zvuk</h2><label>Kamo<select name="target">${o(S.groups,g=>`<option value="group:${g.id}" ${t=='group:'+g.id?'selected':''}>Grupa: ${esc(g.name)}</option>`)}${o(S.devices,d=>`<option value="device:${d.id}" ${t=='device:'+d.id?'selected':''}>${esc(d.name)}${lname(d)?' · '+esc(lname(d)):''}</option>`)}</select></label>
  <label>Što<select name="src"><optgroup label="Mikrofon"><option value="live">Govori uživo (mikrofon)</option></optgroup><optgroup label="Zapisi">${o(S.files,f=>`<option value="file:${esc(f)}">${esc(f)}</option>`)}</optgroup><optgroup label="Playliste">${o(S.playlists,p=>`<option value="playlist:${p.id}">${esc(p.name)}</option>`)}</optgroup></select></label>
  <label class="ck"><input type="checkbox" name="loop">Ponavljaj (petlja)</label><p class="mute" style="margin:0;text-transform:none;letter-spacing:0">Pojedinačna obavijest ima prednost pred grupnom, a grupna pred playlistom.</p>${btns('Pusti')}</form>`);
  submit(async b=>{const [tt,ti]=b.target.split(':'),[st,sv]=b.src.split(/:(.*)/s);if(b.src=='live')return live(b.target);
    const r=await api('POST','play',{target:{type:tt,id:ti},source:st=='file'?{type:'file',name:sv}:{type:'playlist',id:sv},loop:b.loop==='on'});
    if(r.skipped.length)alert('Preskočeno (zauzeto): '+r.skipped.join(', '))})}
async function live(target){stopMic();try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const w=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host+'/ws/live?target='+target);
  const rec=new MediaRecorder(stream);mic={ws:w,rec,stream};
  w.onmessage=e=>{const m=JSON.parse(e.data);if(m.error){alert(m.error);stopMic()}else rec.start(250)};
  rec.ondataavailable=e=>w.readyState==1&&e.data.size&&w.send(e.data);w.onclose=stopMic}
  catch(e){const n=e&&e.name;alert(!window.isSecureContext||!navigator.mediaDevices?`Preglednik ne smatra ovu stranicu sigurnom (${location.origin}). Otvori je preko https:// s valjanim certifikatom, ne preko http:// ili IP adrese.`
    :n==='NotAllowedError'?'Pristup mikrofonu je odbijen. Dopusti mikrofon za ovu stranicu (ikona lokota u adresnoj traci) ili ga blokira pravilo Permissions-Policy / postavke preglednika.'
    :n==='NotFoundError'?'Nije pronađen nijedan mikrofon.':n==='NotReadableError'?'Mikrofon koristi druga aplikacija.':'Mikrofon nije dostupan: '+(n||'')+' '+(e&&e.message||''))}}
function stopMic(){if(!mic)return;const m=mic;mic=null;try{m.rec.state!='inactive'&&m.rec.stop()}catch{};m.stream.getTracks().forEach(t=>t.stop());try{m.ws.close()}catch{}}
const stopJob=async id=>{stopMic();await api('POST','stop',{jobId:id})};
const del=(k,id)=>confirm('Obrisati?')&&api('DELETE',k+'/'+id),delFile=f=>confirm('Obrisati '+f+'?')&&api('DELETE','files/'+encodeURIComponent(f));
const up=async i=>{const f=new FormData();[...i.files].forEach(x=>f.append('f',x));await api('POST','files',f)};
const imp=async i=>{const f=new FormData();f.append('f',i.files[0]);await api('POST','playlists/import',f)};
init();
</script></body></html>
